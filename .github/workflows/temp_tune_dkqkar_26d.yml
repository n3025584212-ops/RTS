name: TEMP tune DKQKAR 26D

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_tune_dkqkar_26d.yml'

permissions:
  contents: read

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/dkqkar-s4-26d-run-20260930
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn openpyxl
      - name: Tune 26D
        working-directory: experiments/s4_force_26d
        run: python tune_26d.py
      - name: Upload tuning outputs
        uses: actions/upload-artifact@v4
        with:
          name: dkqkar-26d-tuning
          path: |
            experiments/s4_force_26d/tune_26d_grid.csv
            experiments/s4_force_26d/tune_26d_summary.json
          retention-days: 7
