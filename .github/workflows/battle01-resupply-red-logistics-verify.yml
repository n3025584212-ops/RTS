name: Battle01 Resupply and RED Logistics Verify

on:
  push:
    branches: [main]
    paths:
      - 'scripts/battle01/**'
      - 'scenes/battle01/**'
      - 'resources/formations/**'
      - 'tests/**'
      - '.github/workflows/battle01-resupply-red-logistics-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Godot 4.7.1 focused resupply runtime gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="4.7.1-stable"
          GODOT_ARCHIVE="Godot_v4.7.1-stable_linux.x86_64.zip"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_ARCHIVE}" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify engine
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --version | tee godot-version.log
          "$GODOT" --version | grep -E '^4\.7\.1'

      - name: Parse and import
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s "$GODOT" --headless --editor --path . --quit 2>&1 | tee parse-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access' parse-import.log

      - name: Real Battle01 boot
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path . --quit-after 120 2>&1 | tee battle01-boot.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access' battle01-boot.log
          grep -q 'FRONTLINE_BOOT_OK' battle01-boot.log
          grep -q 'FRONTLINE_RESUPPLY_CONTROLLER_READY' battle01-boot.log

      - name: New resupply and RED logistics smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$GODOT" --headless --path . --script tests/battle01_resupply_red_logistics_smoke.gd 2>&1 | tee resupply-red-logistics.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access|RESUPPLY_RED_LOGISTICS_SMOKE_FAILURE' resupply-red-logistics.log
          grep -q 'BLUE_RESUPPLY_INTENT_WEST_RENDEZVOUS_PASS' resupply-red-logistics.log
          grep -q 'BLUE_RESUPPLY_FORWARD_RALLY_PASS' resupply-red-logistics.log
          grep -q 'BLUE_RESUPPLY_DIRECT_MOVE_OVERRIDE_PASS' resupply-red-logistics.log
          grep -q 'RED_RESUPPLY_ARMOR_PRIORITY_PASS' resupply-red-logistics.log
          grep -q 'RED_RESUPPLY_ACTUAL_TRANSFER_PASS' resupply-red-logistics.log
          grep -q 'RED_RESUPPLY_EVADE_OVERRIDE_PASS' resupply-red-logistics.log
          grep -q 'FRONTLINE_RESUPPLY_RED_LOGISTICS_SMOKE_PASS' resupply-red-logistics.log

      - name: Revised role capture regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$GODOT" --headless --path . --script tests/battle01_role_capture_v2_smoke.gd 2>&1 | tee role-capture-v2.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access|ROLE_CAPTURE_V2_SMOKE_FAILURE' role-capture-v2.log
          grep -q 'FRONTLINE_ROLE_CAPTURE_V2_SMOKE_PASS' role-capture-v2.log

      - name: Formal roster regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$GODOT" --headless --path . --script tests/formal_combat_roster_smoke.gd 2>&1 | tee formal-roster.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access|FORMAL_ROSTER_SMOKE_FAIL' formal-roster.log
          grep -q 'FRONTLINE_FORMAL_COMBAT_ROSTER_SMOKE_PASS' formal-roster.log

      - name: Logistics flow regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$GODOT" --headless --path . --script tests/battle01_logistics_flow_smoke.gd 2>&1 | tee logistics-flow.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access|LOGISTICS_FLOW_SMOKE_FAILURE' logistics-flow.log
          grep -q 'FRONTLINE_LOGISTICS_FLOW_SMOKE_PASS' logistics-flow.log

      - name: Enemy AI final objective regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$GODOT" --headless --path . --script tests/battle01_enemy_ai_final_objective_smoke.gd 2>&1 | tee enemy-ai-final-objective.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access|FINAL_OBJECTIVE_AI_SMOKE_FAILURE' enemy-ai-final-objective.log
          grep -q 'FRONTLINE_ENEMY_AI_FINAL_OBJECTIVE_SMOKE_PASS' enemy-ai-final-objective.log

      - name: 3D foundation regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$GODOT" --headless --path . --script tests/battle01_3d_foundation_smoke.gd 2>&1 | tee foundation-3d.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access|3D_FOUNDATION_SMOKE_FAILURE' foundation-3d.log
          grep -q 'FRONTLINE_3D_FOUNDATION_SMOKE_PASS' foundation-3d.log

      - name: Focused acceptance summary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FRONTLINE_RESUPPLY_RED_LOGISTICS_SMOKE_PASS' resupply-red-logistics.log
          grep -q 'FRONTLINE_ROLE_CAPTURE_V2_SMOKE_PASS' role-capture-v2.log
          grep -q 'FRONTLINE_FORMAL_COMBAT_ROSTER_SMOKE_PASS' formal-roster.log
          grep -q 'FRONTLINE_LOGISTICS_FLOW_SMOKE_PASS' logistics-flow.log
          grep -q 'FRONTLINE_ENEMY_AI_FINAL_OBJECTIVE_SMOKE_PASS' enemy-ai-final-objective.log
          grep -q 'FRONTLINE_3D_FOUNDATION_SMOKE_PASS' foundation-3d.log
          cat > focused-summary.log <<'EOF'
          BLUE_RESUPPLY_RUNTIME=PASS
          RED_RESUPPLY_RUNTIME=PASS
          ROLE_CAPTURE_REGRESSION=PASS
          FORMAL_ROSTER_REGRESSION=PASS
          LOGISTICS_REGRESSION=PASS
          ENEMY_AI_REGRESSION=PASS
          3D_FOUNDATION_REGRESSION=PASS
          BLOCKING_RUNTIME_ERRORS=NONE
          EOF
          cat focused-summary.log
