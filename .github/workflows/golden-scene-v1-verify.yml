name: FRONTLINE Golden Scene V1 Visual Spike

on:
  push:
    branches:
      - dev/godot-golden-scene-v1
    paths:
      - "scenes/production/**"
      - "scripts/production/**"
      - "tools/golden_scene/**"
      - "docs/production/GOLDEN_SCENE_V1_ASSET_MANIFEST.md"
      - ".github/workflows/golden-scene-v1-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "scenes/production/**"
      - "scripts/production/**"
      - "assets/golden_scene/**"
      - "tools/golden_scene/**"
      - "docs/production/GOLDEN_SCENE_V1_ASSET_MANIFEST.md"
      - ".github/workflows/golden-scene-v1-verify.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-scene-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-scene:
    name: Godot 4.7.1 real-asset Golden Scene
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install render runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1 mesa-utils libvulkan1 mesa-vulkan-drivers
          glxinfo -B || true

      - name: Install external asset conversion toolchain when assets are absent
        if: ${{ hashFiles('assets/golden_scene/.visual_assets_v6_complete') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version | head -n 1

      - name: Bootstrap only legally redistributable production assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/golden_scene/bootstrap_assets.sh
          if [[ ! -f assets/golden_scene/.bootstrap_complete ]]; then
            tools/golden_scene/bootstrap_assets.sh 2>&1 | tee golden-assets.log
            golden-visual-v2-assets.log
            golden-visual-v3-assets.log
          else
            echo "FRONTLINE_GOLDEN_ASSET_BOOTSTRAP_ALREADY_PRESENT"
          fi
          test -s assets/golden_scene/vehicles/mbt.glb
          test -s assets/golden_scene/vehicles/ifv.glb
          test -s assets/golden_scene/infantry/soldier.glb
          grep -q 'NO_RESTRICTED_SOURCE_ASSETS=YES' assets/golden_scene/.bootstrap_complete
          find assets/golden_scene -type f | sort | tee golden-asset-files.txt

      - name: Upgrade Golden visual assets V2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/golden_scene/upgrade_visual_assets_v2.sh
          if [[ ! -f assets/golden_scene/.visual_assets_v2_complete ]]; then
            tools/golden_scene/upgrade_visual_assets_v2.sh 2>&1 | tee golden-visual-v2-assets.log
          else
            echo "FRONTLINE_GOLDEN_VISUAL_ASSETS_V2_ALREADY_PRESENT"
          fi
          test -s assets/golden_scene/vehicles/mbt_abrams.glb
          test -s assets/golden_scene/hdri/kloppenheim_05_1k.hdr
          test -s assets/golden_scene/pbr/grass_path_3_diff_1k.png

      - name: Upgrade Golden visual assets V3
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/golden_scene/upgrade_visual_assets_v3.sh
          if [[ ! -f assets/golden_scene/.visual_assets_v3_complete ]]; then
            tools/golden_scene/upgrade_visual_assets_v3.sh 2>&1 | tee golden-visual-v3-assets.log
          else
            echo "FRONTLINE_GOLDEN_VISUAL_ASSETS_V3_ALREADY_PRESENT"
          fi
          test -s assets/golden_scene/pbr/leafy_grass_diff_1k.png
          test -s assets/golden_scene/hdri/hochsal_field_1k.hdr

      - name: Upgrade Golden visual assets V4
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/golden_scene/upgrade_visual_assets_v4.sh
          if [[ ! -f assets/golden_scene/.visual_assets_v4_complete ]]; then
            tools/golden_scene/upgrade_visual_assets_v4.sh 2>&1 | tee golden-visual-v4-assets.log
          else
            echo "FRONTLINE_GOLDEN_VISUAL_ASSETS_V4_ALREADY_PRESENT"
          fi
          test -s assets/golden_scene/city_hd/ordinary_house.glb
          test -s assets/golden_scene/city_hd/apartment_block.glb

      - name: Upgrade Golden visual assets V5
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/golden_scene/upgrade_visual_assets_v5.sh
          if [[ ! -f assets/golden_scene/.visual_assets_v5_complete ]]; then
            tools/golden_scene/upgrade_visual_assets_v5.sh 2>&1 | tee golden-visual-v5-assets.log
          else
            echo "FRONTLINE_GOLDEN_VISUAL_ASSETS_V5_ALREADY_PRESENT"
          fi
          test "$(find assets/golden_scene/city_hq -maxdepth 1 -type f -iname '*.glb' | wc -l)" -gt 0
          test "$(find assets/golden_scene/nature_hq -type f \( -iname '*.gltf' -o -iname '*.glb' \) | wc -l)" -gt 0

      - name: Upgrade Golden visual assets V6
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/golden_scene/upgrade_visual_assets_v6.sh
          if [[ ! -f assets/golden_scene/.visual_assets_v6_complete ]]; then
            tools/golden_scene/upgrade_visual_assets_v6.sh 2>&1 | tee golden-visual-v6-assets.log
          else
            echo "FRONTLINE_GOLDEN_VISUAL_ASSETS_V6_ALREADY_PRESENT"
          fi
          test "$(find assets/golden_scene/city_hq -maxdepth 1 -type f -iname '*.glb' | wc -l)" -ge 2

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="4.7.1-stable"
          GODOT_ARCHIVE="Godot_v4.7.1-stable_linux.x86_64.zip"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_ARCHIVE}"
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 4 --retry-delay 2 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        shell: bash
        run: |
          "$GODOT" --version | tee godot-version.log
          grep -E '^4\.7\.1' godot-version.log

      - name: Import production assets and parse project
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s "$GODOT" --headless --editor --path . --rendering-method gl_compatibility --quit 2>&1 | tee golden-editor-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access' golden-editor-import.log

      - name: Render actual 1920x1080 Golden Scene
        shell: bash
        env:
          FRONTLINE_CAPTURE_GOLDEN: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts/golden_scene
          timeout 120s xvfb-run -a -s "-screen 0 1920x1080x24"             "$GODOT"             --path .             --rendering-method gl_compatibility             --audio-driver Dummy             --resolution 1920x1080             res://scenes/production/GoldenSceneV1.tscn             2>&1 | tee golden-runtime.log
          grep -q 'FRONTLINE_GOLDEN_SCENE_READY resolution_target=1920x1080' golden-runtime.log
          grep -q 'FRONTLINE_GOLDEN_WORLD_READY' golden-runtime.log
          grep -q 'FRONTLINE_GOLDEN_UNITS_READY' golden-runtime.log
          grep -q 'FRONTLINE_GOLDEN_VFX_READY' golden-runtime.log
          grep -q 'FRONTLINE_GOLDEN_HUD_READY' golden-runtime.log
          grep -q 'FRONTLINE_GOLDEN_SCREENSHOT_CAPTURED' golden-runtime.log
          grep -q 'FRONTLINE_GOLDEN_RUNTIME_CONTENT_GATE_PASS' golden-runtime.log
          ! grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|Node not inside tree|GOLDEN_SCENE_REQUIRED_ASSET_MISSING|Failed to load script|Cannot open file|Invalid call|Invalid access' golden-runtime.log

      - name: Verify screenshot is a real 1920x1080 PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, struct, hashlib, json
          p = "artifacts/golden_scene/golden_scene_v1_actual_1920x1080.png"
          with open(p, "rb") as f:
              data = f.read()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (1920, 1080):
              raise SystemExit(f"wrong screenshot size {(width, height)}")
          if len(data) < 180_000:
              raise SystemExit(f"screenshot unexpectedly small: {len(data)} bytes")
          sha = hashlib.sha256(data).hexdigest()
          print(f"FRONTLINE_GOLDEN_PNG_VERIFY_PASS width={width} height={height} bytes={len(data)} sha256={sha}")
          metrics = json.load(open("artifacts/golden_scene/runtime_metrics.json", "r", encoding="utf-8"))
          required = metrics["runtime_content_checks"]
          failed = [k for k, v in required.items() if not v]
          if failed:
              raise SystemExit("runtime content checks failed: " + ",".join(failed))
          PY

      - name: Retain actual runtime evidence on spike branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FRONTLINE Visual Spike Bot"
          git config user.email "frontline-visual-spike@users.noreply.github.com"
          git add assets/golden_scene artifacts/golden_scene
          if git diff --cached --quiet; then
            echo "No new vendored assets/evidence to persist."
          else
            git commit -m "evidence: vendor legal assets and capture Golden Scene V1 runtime"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload Golden Scene proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontline-golden-scene-v1-proof
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/golden_scene/golden_scene_v1_actual_1920x1080.png
            artifacts/golden_scene/runtime_metrics.json
            artifacts/golden_scene/runtime_evidence.md
            golden-runtime.log
            golden-editor-import.log
            golden-asset-files.txt
            golden-assets.log
