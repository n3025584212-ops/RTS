name: FRONTLINE Full Battlefield Town Probe C

on:
  push:
    branches:
      - dev/river-town-local-high-fidelity-v1
    paths:
      - "scenes/production/FullBattlefieldTownProbeC.tscn"
      - "scripts/production/full_battlefield_town_probe_c.gd"
      - ".github/workflows/full-battlefield-town-probe-c.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-battlefield-town-probe-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Godot 4.7.1 asymmetric-town wall probe
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install render runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          curl -fL --retry 4 --retry-delay 2 "$URL" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" --version

      - name: Import and compile Probe C
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          timeout 600s "$GODOT" --headless --editor --path . --rendering-method forward_plus --rendering-driver vulkan --quit 2>&1 | tee town-probe-c-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|Failed to load script|Cannot open file|Invalid call|Invalid access' town-probe-c-import.log

      - name: Render Probe C at 1920x1080 Forward+
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/full_battlefield_v2_lod
          timeout 1800s xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$GODOT" --path . --display-driver x11 --rendering-method forward_plus --rendering-driver vulkan --audio-driver Dummy \
            --resolution 1920x1080 res://scenes/production/FullBattlefieldTownProbeC.tscn -- \
            --capture --capture-frame=1 2>&1 | tee town-probe-c-runtime.log
          grep -q 'FRONTLINE_FULL_BATTLEFIELD_V2_LOD_READY' town-probe-c-runtime.log
          grep -q 'FRONTLINE_FULL_BATTLEFIELD_V2_LOD_V5_READY' town-probe-c-runtime.log
          grep -q 'FRONTLINE_TOWN_PROBE_C_READY' town-probe-c-runtime.log
          grep -q 'FRONTLINE_FULL_BATTLEFIELD_V2_LOD_CAPTURED' town-probe-c-runtime.log
          grep -q 'Forward+' town-probe-c-runtime.log
          ! grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|Failed to load script|Cannot open file|Invalid call|Invalid access' town-probe-c-runtime.log

      - name: Verify Probe C viewport proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct
          p="artifacts/full_battlefield_v2_lod/full_battlefield_v2_lod_actual_1920x1080.png"
          data=open(p,"rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II",data[16:24]) == (1920,1080)
          m=json.load(open("artifacts/full_battlefield_v2_lod/runtime_metrics.json","r",encoding="utf-8"))
          assert m["engine"]["major"] == 4 and m["engine"]["minor"] == 7 and m["engine"]["patch"] == 1
          assert m["post_capture_image_editing"] is False
          assert m["near_quality_source"].startswith("RiverTownHeroShotV2")
          assert m["grass_instances"] >= 99000
          assert m["mid_buildings"] >= 22
          print("FRONTLINE_TOWN_PROBE_C_PNG_PASS", len(data), m["renderer"], m["mid_buildings"])
          PY

      - name: Upload Probe C proof and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontline-full-battlefield-town-probe-c
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/full_battlefield_v2_lod/full_battlefield_v2_lod_actual_1920x1080.png
            artifacts/full_battlefield_v2_lod/runtime_metrics.json
            town-probe-c-runtime.log
            town-probe-c-import.log
