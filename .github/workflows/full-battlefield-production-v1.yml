name: FRONTLINE Full Battlefield Production V1

on:
  push:
    branches:
      - dev/river-town-local-high-fidelity-v1
    paths:
      - "scenes/production/FullBattlefieldProductionV1.tscn"
      - "scripts/production/full_battlefield_production_v1.gd"
      - "scripts/production/river_town_visual_slice.gd"
      - "scripts/production/visual_slice_*.gdshader"
      - ".github/workflows/full-battlefield-production-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-battlefield-production-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Godot 4.7.1 Forward+ full battlefield
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install render runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          curl -fL --retry 4 --retry-delay 2 "$URL" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" --version

      - name: Import and compile production scene
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          timeout 180s "$GODOT" --headless --editor --path . --rendering-method forward_plus --quit 2>&1 | tee full-battlefield-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|Failed to load script|Cannot open file|Invalid call|Invalid access' full-battlefield-import.log

      - name: Render actual 1920x1080 battlefield
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts/full_battlefield_v1
          timeout 900s xvfb-run -a -s "-screen 0 1920x1080x24"             "$GODOT" --path . --rendering-method forward_plus --audio-driver Dummy             --resolution 1920x1080 res://scenes/production/FullBattlefieldProductionV1.tscn --             --capture --capture-frame=16 2>&1 | tee full-battlefield-runtime.log
          grep -q 'FRONTLINE_FULL_BATTLEFIELD_READY' full-battlefield-runtime.log
          grep -q 'FRONTLINE_FULL_BATTLEFIELD_CAPTURED' full-battlefield-runtime.log
          ! grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|Failed to load script|Cannot open file|Invalid call|Invalid access' full-battlefield-runtime.log

      - name: Verify native screenshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct
          p="artifacts/full_battlefield_v1/full_battlefield_actual_1920x1080.png"
          data=open(p,"rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II",data[16:24]) == (1920,1080)
          metrics=json.load(open("artifacts/full_battlefield_v1/runtime_metrics.json","r",encoding="utf-8"))
          assert metrics["engine"]["major"] == 4 and metrics["engine"]["minor"] == 7 and metrics["engine"]["patch"] == 1
          assert metrics["renderer"] == "forward_plus"
          assert metrics["post_capture_image_editing"] is False
          assert metrics["units"] >= 50
          assert metrics["buildings"] >= 50
          print("FRONTLINE_FULL_BATTLEFIELD_PNG_PASS",len(data),metrics["units"],metrics["buildings"])
          PY

      - name: Upload actual battlefield proof
        uses: actions/upload-artifact@v4
        with:
          name: frontline-full-battlefield-production-v1
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/full_battlefield_v1/full_battlefield_actual_1920x1080.png
            artifacts/full_battlefield_v1/runtime_metrics.json
            full-battlefield-runtime.log
            full-battlefield-import.log
