name: FRONTLINE Asset Pipeline V2 Multi-Source Proof

on:
  workflow_dispatch:
  push:
    branches:
      - dev/asset-pipeline-v2-multi-source
    paths:
      - 'tools/asset_pipeline/**'
      - 'scripts/production/asset_pipeline_v2_proof.gd'
      - 'scenes/production/AssetPipelineV2Proof.tscn'
      - '.github/workflows/asset-pipeline-v2-proof.yml'

permissions:
  contents: read

concurrency:
  group: frontline-asset-pipeline-v2-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-proof:
    name: Godot 4.7.1 Run5 baseline + multi-source proof
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Blender 4.2 LTS
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_VERSION="4.2.23"
          URL="https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fL --retry 4 --retry-delay 2 "$URL" -o "$RUNNER_TEMP/blender.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          BLENDER="$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender"
          chmod +x "$BLENDER"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
          "$BLENDER" --version

      - name: Build one procedural rural-house prototype
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/generated/asset_pipeline_v1/rural_house
          "$BLENDER" --background \
            --python tools/asset_pipeline/build_rural_house_family.py -- \
            --output-dir assets/generated/asset_pipeline_v1/rural_house 2>&1 | tee asset-pipeline-v2-house.log
          test -s assets/generated/asset_pipeline_v1/rural_house/rural_house_a_intact_lod0.glb

      - name: Process genuinely different source models with one generic script
        shell: bash
        run: |
          set -euo pipefail
          OUT=assets/generated/asset_pipeline_v2/source_derivatives
          mkdir -p "$OUT"
          "$BLENDER" --background --python tools/asset_pipeline/process_source_asset.py -- \
            --input assets/visual_slice/hero_v2/urban_ruin/urban_ruin.gltf \
            --output "$OUT/urban_ruin_processed.glb" \
            --label urban_ruin --lod-ratio 1.0 2>&1 | tee asset-pipeline-v2-urban.log
          "$BLENDER" --background --python tools/asset_pipeline/process_source_asset.py -- \
            --input assets/golden_scene/city_real/church_landmark.glb \
            --output "$OUT/church_landmark_processed.glb" \
            --label church_landmark --lod-ratio 1.0 2>&1 | tee asset-pipeline-v2-church.log
          test -s "$OUT/urban_ruin_processed.glb"
          test -s "$OUT/church_landmark_processed.glb"
          grep -q 'FRONTLINE_ASSET_PIPELINE_V2_GENERIC_SOURCE_PASS' asset-pipeline-v2-urban.log
          grep -q 'FRONTLINE_ASSET_PIPELINE_V2_GENERIC_SOURCE_PASS' asset-pipeline-v2-church.log

      - name: Protect all accepted high-fidelity anchors
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/visual_slice/abrams.glb
          test -s assets/visual_slice/hero_v2/abrams_v2.glb
          test -s assets/visual_slice/hero_v2/urban_ruin/urban_ruin.gltf
          test -s assets/visual_slice/hero_house_ruined_hf.glb
          test -s assets/golden_scene/vehicles/ifv.glb
          test -s assets/visual_slice/surfaces/worn_plaster_wall_diff.jpg
          test -s assets/visual_slice/surfaces/brick_wall_005_diff.jpg
          test -s assets/visual_slice/surfaces/roof_tiles_14_diff.jpg
          echo FRONTLINE_ACCEPTED_ASSETS_PRESERVED=YES
          echo FRONTLINE_PROOF_ARMOR_BASELINE=assets/visual_slice/abrams.glb

      - name: Install render runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          curl -fL --retry 4 --retry-delay 2 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Import and compile V2 proof
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          timeout 900s "$GODOT" --headless --editor --path . --rendering-method forward_plus --rendering-driver vulkan --quit 2>&1 | tee asset-pipeline-v2-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|Failed to load script|Cannot open file|Invalid call|Invalid access' asset-pipeline-v2-import.log

      - name: Render Run5 baseline multi-source proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asset_pipeline_v2
          timeout 1200s xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$GODOT" --path . --display-driver x11 --rendering-method forward_plus --rendering-driver vulkan --audio-driver Dummy \
            --resolution 1920x1080 res://scenes/production/AssetPipelineV2Proof.tscn -- \
            --capture --capture-frame=3 2>&1 | tee asset-pipeline-v2-runtime.log
          grep -q 'FRONTLINE_RIVER_TOWN_READY' asset-pipeline-v2-runtime.log
          grep -q 'FRONTLINE_ASSET_PIPELINE_V2_PROOF_READY model_classes=3' asset-pipeline-v2-runtime.log
          grep -q 'accepted_run5_abrams=assets/visual_slice/abrams.glb' asset-pipeline-v2-runtime.log
          grep -q 'extra_vehicle_assets_added=NO' asset-pipeline-v2-runtime.log
          grep -q 'FRONTLINE_ASSET_PIPELINE_V2_CAPTURED' asset-pipeline-v2-runtime.log
          grep -q 'Forward+' asset-pipeline-v2-runtime.log
          ! grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|Failed to load script|Cannot open file|Invalid call|Invalid access' asset-pipeline-v2-runtime.log

      - name: Verify actual viewport evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct
          p='artifacts/asset_pipeline_v2/asset_pipeline_v2_actual_1920x1080.png'
          data=open(p,'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', data[16:24]) == (1920,1080)
          m=json.load(open('artifacts/asset_pipeline_v2/runtime_metrics.json','r',encoding='utf-8'))
          e=m['engine']
          assert e['major']==4 and e['minor']==7 and e['patch']==1
          assert m['proof_model_classes']==3
          assert m['proof_models']==['generated_rural_house','processed_urban_ruin','processed_church_landmark']
          assert m['accepted_run5_abrams_path']=='res://assets/visual_slice/abrams.glb'
          assert m['extra_vehicle_assets_added'] is False
          assert m['accepted_high_fidelity_assets_deleted_or_replaced'] is False
          assert m['post_capture_image_editing'] is False
          assert m['visual_acceptance']=='NOT_CLAIMED'
          print('FRONTLINE_ASSET_PIPELINE_V2_PROOF_PNG_PASS', len(data), m['renderer'], m['proof_models'], m['pbr_rebound_surfaces'])
          PY

      - name: Upload V2 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontline-asset-pipeline-v2-proof
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/asset_pipeline_v2/asset_pipeline_v2_actual_1920x1080.png
            artifacts/asset_pipeline_v2/runtime_metrics.json
            assets/generated/asset_pipeline_v2/source_derivatives/*.json
            asset-pipeline-v2-house.log
            asset-pipeline-v2-urban.log
            asset-pipeline-v2-church.log
            asset-pipeline-v2-import.log
            asset-pipeline-v2-runtime.log
