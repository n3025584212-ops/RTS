name: Frontline Core Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Core parse and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="4.7.1-stable"
          GODOT_ARCHIVE="Godot_v4.7.1-stable_linux.x86_64.zip"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_ARCHIVE}"
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 --retry-delay 2 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        shell: bash
        run: |
          "$GODOT" --version | grep -E '^4\.7\.1'

      - name: Parse project
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s "$GODOT" --headless --editor --path . --quit 2>&1 | tee godot-editor.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access' godot-editor.log

      - name: Prototype B task/reserve smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path . --script tests/prototype_b_task_reserve_smoke.gd 2>&1 | tee godot-prototype-b.log
          grep -q 'PROTOTYPE_B_TASK_RESERVE_SMOKE=PASS' godot-prototype-b.log

      - name: Core role/capture regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path . --script tests/battle01_role_capture_v2_smoke.gd 2>&1 | tee godot-core.log
          grep -q 'FRONTLINE_ROLE_CAPTURE_V2_SMOKE_PASS' godot-core.log

      - name: Core navigation regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path . --quit-after 3000 -- --battle01-ci-navigation-smoke 2>&1 | tee godot-navigation.log
          grep -q 'FRONTLINE_NAVIGATION_SMOKE_PASS' godot-navigation.log

      - name: Core enemy AI regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path . --quit-after 500 -- --battle01-ci-enemy-ai-smoke 2>&1 | tee godot-enemy-ai.log
          grep -q 'FRONTLINE_ENEMY_AI_SMOKE_PASS' godot-enemy-ai.log
