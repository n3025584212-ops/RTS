name: Godot 4.7.1 Runtime Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Headless parse and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="4.7.1-stable"
          GODOT_ARCHIVE="Godot_v4.7.1-stable_linux.x86_64.zip"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_ARCHIVE}"

          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 --retry-delay 2 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --version | tee godot-version.log
          "$GODOT" --version | grep -E '^4\.7\.1'

      - name: Parse and import project
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s "$GODOT" --headless --editor --path . --quit 2>&1 | tee godot-editor.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access' godot-editor.log; then
            echo 'Godot editor parse/import reported a blocking error.'
            exit 1
          fi

      - name: Run terrain LOS and combat regression smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path . --quit-after 3000 -- --battle01-ci-intel-combat-smoke 2>&1 | tee godot-runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access' godot-runtime.log; then
            echo 'Godot runtime reported a blocking error.'
            exit 1
          fi
          grep -q 'FRONTLINE_BOOT_OK' godot-runtime.log
          grep -q 'FRONTLINE_FORMATION_DEFINITIONS_READY count=6' godot-runtime.log
          grep -q 'FRONTLINE_RECON_CONTACT_READY' godot-runtime.log
          grep -q 'FRONTLINE_TERRAIN_LOS_SMOKE_READY' godot-runtime.log
          grep -q 'FRONTLINE_INTEL_CONTACT' godot-runtime.log
          grep -q 'FRONTLINE_INTEL_CONFIRMED' godot-runtime.log
          grep -q 'FRONTLINE_TERRAIN_LOS_BLOCKED' godot-runtime.log
          grep -q 'FRONTLINE_INTEL_LAST_KNOWN' godot-runtime.log
          grep -q 'FRONTLINE_FLANK_LOS_REACQUIRED' godot-runtime.log
          grep -q 'FRONTLINE_SMOKE_LOS_BLOCKED' godot-runtime.log
          grep -q 'FRONTLINE_RED_DESTROYED' godot-runtime.log
          grep -q 'FRONTLINE_OBJECTIVE_CAPTURED' godot-runtime.log
          grep -q 'FRONTLINE_VICTORY' godot-runtime.log
          grep -q 'FRONTLINE_TERRAIN_LOS_SMOKE_PASS' godot-runtime.log

      - name: Run multi-formation command smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path . --quit-after 3000 -- --battle01-ci-multi-command-smoke 2>&1 | tee godot-multi-command.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access' godot-multi-command.log; then
            echo 'Godot multi-command runtime reported a blocking error.'
            exit 1
          fi
          grep -q 'FRONTLINE_MULTI_FORMATION_COMMAND_READY' godot-multi-command.log
          grep -q 'FRONTLINE_SELECTION_RECON_ONLY' godot-multi-command.log
          grep -q 'FRONTLINE_COMMAND_RECON_MOVE' godot-multi-command.log
          grep -q 'FRONTLINE_RECON_SCOUT_CONFIRMED' godot-multi-command.log
          grep -q 'FRONTLINE_SELECTION_IFV_ONLY' godot-multi-command.log
          grep -q 'FRONTLINE_COMMAND_IFV_MOVE' godot-multi-command.log
          grep -q 'FRONTLINE_BOX_MULTI_SELECTED count=2' godot-multi-command.log
          grep -q 'FRONTLINE_GROUP_MOVE_ISSUED count=2' godot-multi-command.log
          grep -q 'FRONTLINE_COMBAT_STARTED' godot-multi-command.log
          grep -q 'FRONTLINE_RED_DESTROYED' godot-multi-command.log
          grep -q 'FRONTLINE_OBJECTIVE_CAPTURED' godot-multi-command.log
          grep -q 'FRONTLINE_VICTORY' godot-multi-command.log
          grep -q 'FRONTLINE_MULTI_FORMATION_COMMAND_SMOKE_PASS' godot-multi-command.log

      - name: Run navigation route smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path . --quit-after 3000 -- --battle01-ci-navigation-smoke 2>&1 | tee godot-navigation.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access' godot-navigation.log; then
            echo 'Godot navigation runtime reported a blocking error.'
            exit 1
          fi
          grep -q 'FRONTLINE_NAVIGATION_ROUTE_READY' godot-navigation.log
          grep -q 'CENTRAL_ROUTE_VALID' godot-navigation.log
          grep -q 'FRONTLINE_CENTRAL_ROUTE_PASS' godot-navigation.log
          grep -q 'NORTH_ROUTE_VALID' godot-navigation.log
          grep -q 'FRONTLINE_NORTH_ROUTE_PASS' godot-navigation.log
          grep -q 'SOUTH_ROUTE_VALID' godot-navigation.log
          grep -q 'FRONTLINE_SOUTH_ROUTE_PASS' godot-navigation.log
          grep -q 'RIVER_CANNOT_BE_CROSSED_OUTSIDE_BRIDGE' godot-navigation.log
          grep -q 'FORMATION_PATHS_AROUND_BLOCKER' godot-navigation.log
          grep -q 'FRONTLINE_SINGLE_RECON_NAV_PASS' godot-navigation.log
          grep -q 'FRONTLINE_SINGLE_IFV_NAV_PASS' godot-navigation.log
          grep -q 'MULTI_FORMATION_MOVE_WORKS' godot-navigation.log
          grep -q 'FRONTLINE_MULTI_FORMATION_NAV_PASS' godot-navigation.log
          grep -q 'RECON_LOS_REGRESSION_PASS' godot-navigation.log
          grep -q 'FRONTLINE_NAVIGATION_SMOKE_PASS' godot-navigation.log

      - name: Aggregate navigation acceptance
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FRONTLINE_CENTRAL_ROUTE_PASS' godot-navigation.log && echo CENTRAL_ROUTE_VALID
          grep -q 'FRONTLINE_NORTH_ROUTE_PASS' godot-navigation.log && echo NORTH_ROUTE_VALID
          grep -q 'FRONTLINE_SOUTH_ROUTE_PASS' godot-navigation.log && echo SOUTH_ROUTE_VALID
          grep -q 'FRONTLINE_RIVER_BLOCKING_PASS' godot-navigation.log && echo RIVER_CANNOT_BE_CROSSED_OUTSIDE_BRIDGE
          grep -q 'FRONTLINE_FORMATION_PATH_AROUND_BLOCKER_PASS' godot-navigation.log && echo FORMATION_PATHS_AROUND_BLOCKER
          grep -q 'FRONTLINE_MULTI_FORMATION_NAV_PASS' godot-navigation.log && echo MULTI_FORMATION_MOVE_WORKS
          grep -q 'FRONTLINE_TERRAIN_LOS_SMOKE_PASS' godot-runtime.log && echo RECON_LOS_REGRESSION_PASS
          grep -q 'FRONTLINE_RED_DESTROYED' godot-runtime.log && echo COMBAT_REGRESSION_PASS
          grep -q 'FRONTLINE_OBJECTIVE_CAPTURED' godot-runtime.log && echo OBJECTIVE_CAPTURE_PASS
          grep -q 'FRONTLINE_VICTORY' godot-runtime.log && echo VICTORY_PASS
          echo FRONTLINE_NAVIGATION_ROUTE_READY
          echo FRONTLINE_CENTRAL_ROUTE_PASS
          echo FRONTLINE_NORTH_ROUTE_PASS
          echo FRONTLINE_SOUTH_ROUTE_PASS
          echo FRONTLINE_NAVIGATION_SMOKE_PASS
        | tee godot-navigation-summary.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-runtime-verification-${{ github.sha }}
          path: |
            godot-version.log
            godot-editor.log
            godot-runtime.log
            godot-multi-command.log
            godot-navigation.log
            godot-navigation-summary.log
          if-no-files-found: warn
          retention-days: 14
