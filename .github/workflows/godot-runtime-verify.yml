name: Frontline Core Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Core parse and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="4.7.1-stable"
          GODOT_ARCHIVE="Godot_v4.7.1-stable_linux.x86_64.zip"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_ARCHIVE}"
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 --retry-delay 2 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        shell: bash
        run: |
          "$GODOT" --version | grep -E '^4\.7\.1'

      - name: Parse project
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s "$GODOT" --headless --editor --path . --quit 2>&1 | tee godot-editor.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Invalid call|Invalid access' godot-editor.log

      - name: Core formation task autonomy combat regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path . --script tests/core_v1_batch1_smoke.gd 2>&1 | tee godot-core-v1.log
          grep -q 'FRONTLINE_CORE_V1_BATCH1_SMOKE_PASS' godot-core-v1.log

      - name: BattleNavigation Core service compatibility
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path . --script tests/core_v1_battle_navigation_compat_smoke.gd 2>&1 | tee godot-nav-compat.log
          grep -q 'FRONTLINE_CORE_V1_BATTLE_NAV_COMPAT_PASS' godot-nav-compat.log

      # Historical Battle01 role/capture/enemy-AI smoke tests are intentionally not
      # Core gates. CURRENT_STATE V10 reopens those scenario/product contracts.
      # They may remain as legacy evidence, but must not define Core V1 health.
